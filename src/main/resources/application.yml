spring:
  thymeleaf:
    cache: false
  # ------ 新增配置开始 ------
  servlet:
    multipart:
      max-file-size: 50MB      # 单个文件最大 50MB (按需调整)
      max-request-size: 50MB   # 整个请求最大 50MB
  # ------ 新增配置结束 ------
  #  链接数据库
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag_demo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  #定义是否由其自动生成数据库！
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_DOCUMENT_PREFETCH:1}
  ai:
    model:
      chat: zhipuai
      embedding: zhipuai
    zhipuai:
      api-key: ${ZHIPU_API_KEY}
      base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas}
      chat:
        options:
          model: ${zhipu.chat-model}
      embedding:
        options:
          model: ${zhipu.embedding-model}
          dimensions: 768
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        name: rag-agent-mcp-client
        version: 1.0.0
        request-timeout: ${MCP_REQUEST_TIMEOUT:60s}
        type: SYNC
        toolcallback:
          enabled: true

#配置API
zhipu:
  #  embedding模型都要花钱！
  embedding-model: "embedding-3"
  #  花钱模型
  #  chat-model: "glm-4-plus"
  #  免费模型
  #  chat-model: "glm-4.5-flash" 过期了！
  #  chat-model: "glm-4.6v-flash"
  chat-model: "glm-4.7-flash"

# A blank DSN leaves Sentry event reporting inactive. SENTRY_DSN and the MCP
# access token are different credentials: DSN sends events; the token reads
# them through Sentry's API.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:simple-demo@0.0.1}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false

agent:
  admin:
    user-ids: ${AGENT_ADMIN_USER_IDS:1}
  history:
    summary-max-chars: ${AGENT_HISTORY_SUMMARY_MAX_CHARS:3000}
    # Only summarize after enough historical context accumulates.
    summary-trigger-message-count: ${AGENT_HISTORY_SUMMARY_TRIGGER_MESSAGE_COUNT:6}
    summary-trigger-tokens: ${AGENT_HISTORY_SUMMARY_TRIGGER_TOKENS:1500}
  context:
    # Approximate budget used when selecting messages and auxiliary context.
    # The context manager uses a conservative character-to-token estimate.
    max-tokens: ${AGENT_CONTEXT_MAX_TOKENS:6000}
    recent-message-tokens: ${AGENT_CONTEXT_RECENT_MESSAGE_TOKENS:2200}
    relevant-message-tokens: ${AGENT_CONTEXT_RELEVANT_MESSAGE_TOKENS:900}
    relevant-execution-tokens: ${AGENT_CONTEXT_RELEVANT_EXECUTION_TOKENS:1000}
    memory-tokens: ${AGENT_CONTEXT_MEMORY_TOKENS:1000}
  memory:
    enabled: ${AGENT_MEMORY_ENABLED:true}
    max-items-per-run: ${AGENT_MEMORY_MAX_ITEMS_PER_RUN:5}
    max-retrieved-items: ${AGENT_MEMORY_MAX_RETRIEVED_ITEMS:6}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # DeepSeek retired the old "deepseek-chat" name; the API now accepts
    # deepseek-v4-flash (fast/cheap) or deepseek-v4-pro (stronger).
    model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
    temperature: ${DEEPSEEK_TEMPERATURE:0.4}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:2048}
  react:
    max-steps: ${AGENT_REACT_MAX_STEPS:8}
    # Keep private Agent outputs outside the publicly mapped uploads tree.
    workspace-root: ${AGENT_REACT_WORKSPACE_ROOT:data/agent-workspace}
    web-search:
      api-key: ${AGENT_REACT_WEB_SEARCH_API_KEY:}
      endpoint: ${AGENT_REACT_WEB_SEARCH_ENDPOINT:https://api.tavily.com/search}
    resource-download:
      max-bytes: ${AGENT_REACT_RESOURCE_MAX_BYTES:10485760}
    pdf:
      # Blank uses the bundled classpath font: fonts/simhei.ttf.
      # Set this only when an external TTF should override the bundled font.
      font-path: ${AGENT_REACT_PDF_FONT_PATH:}

upload:
  #  dir: D:/javalearning/demo
  dir: .
  root: uploads/
  avatar: uploads/avatar/
  docs: uploads/docs/
  doc-media: uploads/doc-media/
  question-images: uploads/question-images/

rag:
  cache:
    enabled: ${RAG_CACHE_ENABLED:true}
    ttl-seconds: ${RAG_CACHE_TTL_SECONDS:3600}
    key-prefix: rag:retrieval:v2
  retrieval:
    vector-topk: ${RAG_VECTOR_TOPK:20}
    bm25-topk: ${RAG_BM25_TOPK:20}
    final-topk: ${RAG_FINAL_TOPK:10}
    fusion:
      strategy: ${RAG_FUSION_STRATEGY:rrf}
      rrf-k: ${RAG_FUSION_RRF_K:60}
      vector-weight: ${RAG_FUSION_VECTOR_WEIGHT:0.6}
      bm25-weight: ${RAG_FUSION_BM25_WEIGHT:0.4}
    rerank:
      enabled: ${RAG_RERANK_ENABLED:true}
      api:
        # Cross-encoder rerank API. Off by default; set RAG_RERANK_API_ENABLED=true
        # and RAG_RERANK_API_KEY to activate. The default endpoint/model target
        # SiliconFlow; Jina and Cohere share the same /rerank contract.
#        enabled: ${RAG_RERANK_API_ENABLED:false}
        enabled: ${RAG_RERANK_API_ENABLED:ture}
        base-url: ${RAG_RERANK_API_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${RAG_RERANK_API_KEY:}
        model: ${RAG_RERANK_API_MODEL:BAAI/bge-reranker-v2-m3}
        candidate-limit: ${RAG_RERANK_API_CANDIDATE_LIMIT:12}
        timeout-ms: ${RAG_RERANK_API_TIMEOUT_MS:4000}

document:
  parsing:
#    strategy: ${DOCUMENT_PARSING_STRATEGY:structured}
    strategy: simple
  multimodal:
    render-ocr-pages: ${DOCUMENT_MULTIMODAL_RENDER_OCR_PAGES:true}
    page-image-dpi: ${DOCUMENT_MULTIMODAL_PAGE_IMAGE_DPI:120}
    extract-inline-images: ${DOCUMENT_MULTIMODAL_EXTRACT_INLINE_IMAGES:true}
    min-image-width: ${DOCUMENT_MULTIMODAL_MIN_IMAGE_WIDTH:80}
    min-image-height: ${DOCUMENT_MULTIMODAL_MIN_IMAGE_HEIGHT:80}
    max-images-per-page: ${DOCUMENT_MULTIMODAL_MAX_IMAGES_PER_PAGE:20}
  processing:
    max-retries: ${DOCUMENT_PROCESSING_MAX_RETRIES:3}
    retry-delay-ms: ${DOCUMENT_PROCESSING_RETRY_DELAY_MS:30000}
    stale-processing-minutes: ${DOCUMENT_PROCESSING_STALE_MINUTES:30}
    recovery-enabled: ${DOCUMENT_PROCESSING_RECOVERY_ENABLED:true}
    recovery-interval-ms: ${DOCUMENT_PROCESSING_RECOVERY_INTERVAL_MS:60000}
    recovery-batch-size: ${DOCUMENT_PROCESSING_RECOVERY_BATCH_SIZE:20}

ocr:
  enabled: true
  provider: ${OCR_PROVIDER:baidu}
  baidu:
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}
    token-url: ${BAIDU_OCR_TOKEN_URL:https://aip.baidubce.com/oauth/2.0/token}
    endpoint: ${BAIDU_OCR_ENDPOINT:https://aip.baidubce.com/rest/2.0/ocr/v1/general_basic}
    timeout-seconds: ${BAIDU_OCR_TIMEOUT_SECONDS:20}
